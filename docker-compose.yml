version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    container_name: mistral-medical-api
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs    # mount local model weights
    environment:
      - INFERENCE_ENGINE=${INFERENCE_ENGINE:-hf}
      - MODEL_PATH=${MODEL_PATH:-./outputs/mistral-medical-merged}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: mistral-medical-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
